<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b2a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <clipPath id="typing">
      <rect x="60" y="150" height="40" width="0">
        <animate attributeName="width" from="0" to="470" dur="2.6s" begin="1.2s" fill="freeze" calcMode="discrete" keyTimes="0;1" values="0;470"/>
        <animate attributeName="width" values="0;40;80;120;160;200;240;280;320;360;400;440;470" dur="2.6s" begin="1.2s" fill="freeze" calcMode="discrete"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .name { font: 700 56px 'Segoe UI', Helvetica, Arial, sans-serif; fill: url(#accent);
            opacity: 0; animation: rise 1s cubic-bezier(.2,.8,.2,1) .3s forwards; }
    .hello { font: 500 18px 'Courier New', monospace; fill: #7dd3fc; letter-spacing: 3px;
             opacity: 0; animation: rise .8s ease .1s forwards; }
    .sub { font: 400 21px 'Courier New', monospace; fill: #cbd5e1; }
    .cursor { fill: #38bdf8; animation: blink 1s step-end infinite; }
    .line { stroke: url(#accent); stroke-width: 3; stroke-linecap: round;
            stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 2s ease 1s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>

  <rect width="900" height="260" fill="url(#bg)"/>
  <rect width="900" height="260" fill="url(#dots)"/>

  <!-- orbs -->
  <g filter="url(#blur)">
    <circle cx="140" cy="60" r="70" fill="#38bdf8" opacity="0.35">
      <animateTransform attributeName="transform" type="translate" values="0 0; 60 30; 0 0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="200" r="90" fill="#a78bfa" opacity="0.35">
      <animateTransform attributeName="transform" type="translate" values="0 0; -70 -40; 0 0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="40" r="50" fill="#22d3ee" opacity="0.25">
      <animateTransform attributeName="transform" type="translate" values="0 0; -40 50; 0 0" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- floating code symbols -->
  <g font-family="'Courier New', monospace" font-size="26" fill="#94a3b8" opacity="0.35">
    <text x="720" y="90">&lt;/&gt;
      <animate attributeName="y" values="90;76;90" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="800" y="150">{ }
      <animate attributeName="y" values="150;164;150" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="660" y="190">SQL
      <animate attributeName="y" values="190;178;190" dur="7s" repeatCount="indefinite"/>
    </text>
  </g>

  <text class="hello" x="60" y="62">HELLO, WORLD. I'M</text>
  <text class="name" x="60" y="128">NAMA KAMU</text>

  <g clip-path="url(#typing)">
    <text class="sub" x="60" y="176">Web Developer · Database · Embedded</text>
  </g>
  <rect class="cursor" x="60" y="157" width="10" height="24">
    <animate attributeName="x" values="60;100;140;180;220;260;300;340;380;420;460;500;530" dur="2.6s" begin="1.2s" fill="freeze" calcMode="discrete"/>
  </rect>

  <path class="line" d="M60 215 H840"/>
</svg>
